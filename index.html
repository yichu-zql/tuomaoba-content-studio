<title>脱毛吧引流素材台</title>

<style>
/* 布局：顶部门店条 + 平台分栏；每个平台按内容矩阵分主题，每个主题一行可左右翻页的卡片，第一张是空白创意 */

  --warn: #8F5D00;
  --warn-soft: #FCF1DC;
  --var-bg: #FFF1D6;
  --var-ink: #7A4B00;
  --a-bg: #FBE8EA; --a-ink: #9B1C2C;
  --b-bg: #E1EDF8; --b-ink: #1D4F7A;
  --c-bg: #E3F3EA; --c-ink: #1E6B42;

}

  :root:not([data-theme="light"]) {
    --bg: #14151E; --surface: #1D1F2D; --surface-2: #262838; --ink: #ECEAF4; --muted: #A3A2B8; --line: #30324A;
    --accent: #E4596A; --accent-ink: #1A0B0E; --accent-soft: #3A1D25; --good: #6FCF97; --good-soft: #17332A;
    --warn: #F0B952; --warn-soft: #3A2E14; --var-bg: #3A2E14; --var-ink: #F5CF7F;
    --a-bg: #3A1D25; --a-ink: #F3A3AE; --b-bg: #18293B; --b-ink: #9CC6EE; --c-bg: #17332A; --c-ink: #8FDDB0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14151E; --surface: #1D1F2D; --surface-2: #262838; --ink: #ECEAF4; --muted: #A3A2B8; --line: #30324A;
  --accent: #E4596A; --accent-ink: #1A0B0E; --accent-soft: #3A1D25; --good: #6FCF97; --good-soft: #17332A;
  --warn: #F0B952; --warn-soft: #3A2E14; --var-bg: #3A2E14; --var-ink: #F5CF7F;
  --a-bg: #3A1D25; --a-ink: #F3A3AE; --b-bg: #18293B; --b-ink: #9CC6EE; --c-bg: #17332A; --c-ink: #8FDDB0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }

/* 顶部 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 900; font-size: 15px; flex: none; }
.brand b { font-weight: 800; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }

.store-pick { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 3px 6px 3px 12px; min-width: 0; height: 34px; }
.store-pick label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.store-pick select { border: 0; background: transparent; font-weight: 700; max-width: 200px; padding: 2px 4px; }
.store-pick #citySel { max-width: 110px; }
.store-pick .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 34px; padding: 0 14px; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: transparent; padding: 10px 16px 12px; font-weight: 700; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; border-bottom: 3px solid transparent; }
.tab .n { font-family: var(--f-mono); font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.douyin { background: #111; box-shadow: 2px 0 0 #25F4EE inset, -2px 0 0 #FE2C55 inset; }
.dot.xhs { background: #FF2442; }
.dot.sph { background: #FA9D3B; }
.dot.pyq { background: #07C160; }

/* 平台头 */
.plat-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: start; padding-block: 22px 8px; }
.plat-head h1 { font-size: 24px; margin: 0; line-height: 1.3; font-weight: 800; text-wrap: balance; }
.plat-head p { margin: 6px 0 0; color: var(--muted); max-width: 76ch; }
.pdesc { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 18px; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
.pdesc li { position: relative; padding-left: 12px; text-wrap: pretty; max-width: 100%; }
.pdesc li::before { content: ""; position: absolute; left: 0; top: .78em; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
/* 爆款拆解卡片与面板 */
.card.pbcard .thumb { background: var(--ink); }
.pbthumb { position: absolute; inset: 0; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; color: var(--surface); overflow: hidden; }
.pbthumb .pbk { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: .08em; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 7px; }
.pbthumb b { font-size: 20px; line-height: 1.25; font-weight: 800; }
.pbthumb dl { margin: 4px 0 0; display: grid; gap: 4px; font-size: 12px; line-height: 1.5; }
.pbthumb dt { opacity: .62; font-size: 11px; letter-spacing: .04em; }
.pbthumb dd { margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.pb-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
/* 多张图 */
.cv.r11 { aspect-ratio: 1 / 1; height: auto; } .cv.r169 { aspect-ratio: 16 / 9; height: auto; }
.cv.fr .cv-in { justify-content: flex-end; padding-bottom: 9cqw; }
.cv.fr h4 { font-size: 11cqw; }
.cv.fr.r169 h4 { font-size: 6.5cqw; } .cv.fr.r169 .sub { font-size: 3.4cqw; } .cv.fr.r169 .cv-in { padding: 0 5cqw 5cqw; }
.cv.fr.r916 h4 { font-size: 10cqw; }
.cv.fr .frno { position: absolute; right: 5cqw; top: 5cqw; font-size: 4.2cqw; font-weight: 700; background: rgba(0,0,0,.38); color: #fff; border-radius: 999px; padding: .4cqw 2.6cqw; z-index: 2; }
.cv.fr .frnote { margin: 0; font-size: 4.6cqw; line-height: 1.45; opacity: .92; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.cv.fr .frref { position: absolute; left: 50%; top: 4cqw; transform: translateX(-50%); height: 62%; width: auto; max-width: 70%; object-fit: contain; border-radius: 3cqw; box-shadow: 0 2cqw 6cqw rgba(0,0,0,.25); z-index: -1; background: #fff; }
.cv.fr .frph { position: absolute; inset: 0; z-index: -1; display: grid; place-items: start center; padding-top: 14cqw; background: repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 4cqw, rgba(255,255,255,.02) 4cqw 8cqw); }
.cv.fr .frph span { font-size: 4.4cqw; text-align: center; opacity: .8; line-height: 1.5; }
.frview { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; gap: 8px; align-items: center; }
.frview.r916 .frmain { max-width: 240px; } .frview.r34 .frmain, .frview.r11 .frmain { max-width: 300px; }
.frmain { width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
.frnav { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; padding: 0; }
.frthumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; margin-top: 10px; }
.frthumb { padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: none; }
.frthumb.on { border-color: var(--accent); }
.frthumb .cv .frno { display: none; }
.frthumb .cv h4 { font-size: 13cqw; }
.pbsteps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.pbsteps li { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.pbsteps .ps-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pbsteps .ps-t { margin-left: auto; font-size: 12px; color: var(--muted); }
.pbsteps p { margin: 6px 0 0 30px; font-size: 13px; line-height: 1.6; color: var(--ink-2, var(--ink)); }
.pbsteps .frn, .frli-h .frn { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.frlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.frlist li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.frlist li.on { border-color: var(--accent); }
.frli-h { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-align: left; }
.frli-h .frn { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.frlist li.on .frn { background: var(--accent); color: var(--accent-ink); }
.formula { font-weight: 700; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; line-height: 1.6; }
.sub-h { margin: 14px 0 6px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
.pblist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }

.pblist li b { font-weight: 700; }

.cases { display: grid; gap: 12px; }
.case { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.case-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.case a { color: var(--accent); word-break: break-all; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 999px; padding: 0 9px; line-height: 22px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.a { background: var(--a-bg); color: var(--a-ink); }
.pill.b { background: var(--b-bg); color: var(--b-ink); }
.pill.c { background: var(--c-bg); color: var(--c-ink); }
.pill.mine { background: var(--ink); color: var(--surface); }

.theme-nav { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: thin; }
.tn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; text-align: left; display: grid; gap: 2px; min-width: 132px; }
.tn:hover { border-color: var(--ink); }
.tn b { font-size: 13px; }
.tn span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 12px 4px; }
.grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.grp > span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 26px; padding: 0 11px; font-size: 12px; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.search { margin-left: auto; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; height: 32px; padding: 0 12px; min-width: 0; white-space: nowrap; }
.search input { border: 0; background: transparent; width: 190px; outline: none; }

/* 主题分区 */
.theme { padding-block: 22px 6px; border-top: 1px solid var(--line); margin-top: 14px; scroll-margin-top: 120px; }
.theme:first-of-type { border-top: 0; margin-top: 4px; }
.th-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: end; margin-bottom: 12px; }
.th-head h2 { margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.th-head h2 .cnt { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.th-head .say { margin: 4px 0 0; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.th-head .say b { color: var(--ink); font-weight: 600; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager .pg { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
.pager .arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 16px; line-height: 1; padding: 0; }
.pager .arrow:hover:not(:disabled) { border-color: var(--ink); }
.pager .arrow:disabled { opacity: .35; cursor: default; }

.track { --n: 5; display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n)); gap: var(--gap); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 2px 2px 14px; margin: 0 -2px; scrollbar-width: thin; overscroll-behavior-x: contain; }
.track > * { scroll-snap-align: start; min-width: 0; }
@media (max-width: 1200px) { .track { --n: 4; } }
@media (max-width: 940px) { .track { --n: 3; } }
@media (max-width: 640px) { .track { --n: 2; --gap: 10px; } }

/* 卡片：所有平台同一尺寸，封面统一 3:4 */
.card { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); cursor: pointer; display: flex; flex-direction: column; width: 100%; text-align: left; padding: 0; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); }
.card .thumb { aspect-ratio: 3 / 4; overflow: hidden; position: relative; }
.card .meta { padding: 10px 12px 12px; display: grid; gap: 7px; }
.card .ttl { font-weight: 700; line-height: 1.45; font-size: 14px; height: 2.9em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .row { display: flex; gap: 4px; align-items: center; overflow: hidden; white-space: nowrap; height: 22px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); height: 20px; white-space: nowrap; overflow: hidden; }
.card .foot span:first-child { overflow: hidden; text-overflow: ellipsis; }
.card .edited { color: var(--accent); font-weight: 700; flex: none; }
.card.blank { border: 1.5px dashed var(--muted); background: transparent; box-shadow: none; }
.card.blank .thumb { display: grid; place-items: center; background: var(--surface-2); }
.card.blank .plus { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 30px; line-height: 1; font-weight: 300; }
.card.blank .thumb p { margin: 0; position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 12px; color: var(--muted); padding: 0 14px; }
.card.blank:hover { border-color: var(--accent); }
.empty-row { grid-column: span 3; display: grid; place-items: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: var(--r); }

/* 封面（内容本身的配色，两种主题下一致） */
.cv { position: relative; overflow: hidden; color: #fff; isolation: isolate; container-type: inline-size; height: 100%; }
.cv.r34 { aspect-ratio: 3 / 4; height: auto; }
.cv.r916 { aspect-ratio: 9 / 16; height: auto; }
.thumb .cv { aspect-ratio: auto; height: 100%; }

.cv-in { position: absolute; inset: 0; padding: 0 9cqw; display: flex; flex-direction: column; justify-content: center; gap: 4cqw; }

.cv .platmark { position: absolute; right: 6cqw; top: 6.4cqw; font-size: 4cqw; font-weight: 700; padding: .4cqw 2.6cqw; border-radius: 999px; background: rgba(0,0,0,.32); color: #fff; }
.cv.red { background: #C3303F; } .cv.red .sub { background: #FFF1D6; color: #8A1E2A; }
.cv.navy { background: #1E1F3B; } .cv.navy .sub { background: #C3303F; color: #fff; }
.cv.cream { background: #FBF1E2; color: #1E1F3B; } .cv.cream .sub { background: #1E1F3B; color: #FBF1E2; }
.cv.mint { background: #DDF0E4; color: #12422B; } .cv.mint .sub { background: #12422B; color: #DDF0E4; }
.cv.blue { background: #D8E8F6; color: #18375A; } .cv.blue .sub { background: #18375A; color: #D8E8F6; }

.cv .deco { position: absolute; z-index: -1; border-radius: 50%; opacity: .13; background: currentColor; }
.cv .deco.d1 { width: 70cqw; height: 70cqw; right: -24cqw; bottom: -18cqw; }
.cv .deco.d2 { width: 22cqw; height: 22cqw; right: 12cqw; top: 16cqw; opacity: .1; }
.cv.has-img .deco { display: none; }
.cv .vbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 5cqw 6cqw; font-size: 4.4cqw; line-height: 1.35; background: linear-gradient(0deg, rgba(0,0,0,.55), transparent); color: #fff; }
.cv .vbar b { display: block; font-size: 4.8cqw; }
.cv .vbar span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cv .play { position: absolute; left: 50%; top: 50%; width: 12cqw; height: 12cqw; margin: -6cqw 0 0 -6cqw; border-radius: 50%; background: rgba(0,0,0,.28); display: none; }
